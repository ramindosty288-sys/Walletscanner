name: Wallet Scanner FREE 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          rm -rf WalletScanner

          mkdir -p WalletScanner/app/src/main/java/com/walletscanner
          mkdir -p WalletScanner/app/src/main/res/values
          mkdir -p WalletScanner/app/src/main/res/drawable

          cat > WalletScanner/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WalletScanner"
          include(":app")
          EOF

          cat > WalletScanner/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > WalletScanner/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > WalletScanner/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.walletscanner'
              compileSdk 35

              defaultConfig {
                  applicationId "com.walletscanner"
                  minSdk 23
                  targetSdk 35
                  versionCode 20
                  versionName "2.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > WalletScanner/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#00AEEF</item>
                  <item name="android:statusBarColor">#071D2B</item>
                  <item name="android:navigationBarColor">#071D2B</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>
          </resources>
          EOF

          cat > WalletScanner/app/src/main/res/drawable/app_icon.xml <<'EOF'
          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#071D2B"
                  android:pathData="M0,0 L108,0 L108,108 L0,108 Z" />

              <path
                  android:fillColor="#00CFFF"
                  android:pathData="M54,10 L62,43 L77,49 L62,55 L54,98 L46,55 L31,49 L46,43 Z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,22 L58,44 L68,49 L58,52 L54,84 L50,52 L40,49 L50,44 Z" />

          </vector>
          EOF

          cat > WalletScanner/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/app_icon"
                  android:label="Wallet Scanner"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > WalletScanner/app/src/main/java/com/walletscanner/MainActivity.java <<'EOF'
          package com.walletscanner;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private EditText addressInput;
              private TextView resultText;
              private ProgressBar progressBar;
              private Button searchButton;
              private volatile boolean running = false;

              private final Handler handler =
                      new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  buildInterface();
              }

              private void buildInterface() {

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 32, 24, 24);

                  TextView title = new TextView(this);
                  title.setText("🔎 Wallet Scanner");
                  title.setTextSize(28);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  TextView version = new TextView(this);
                  version.setText("FREE 2.0");
                  version.setTextSize(16);
                  version.setGravity(Gravity.CENTER);
                  root.addView(version);

                  addressInput = new EditText(this);
                  addressInput.setHint("آدرس عمومی Bitcoin");
                  addressInput.setSingleLine(true);

                  root.addView(
                          addressInput,
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                  );

                  LinearLayout buttons = new LinearLayout(this);
                  buttons.setOrientation(LinearLayout.HORIZONTAL);

                  searchButton = new Button(this);
                  searchButton.setText("🔍 بررسی");

                  Button stopButton = new Button(this);
                  stopButton.setText("⏹ توقف");

                  buttons.addView(
                          searchButton,
                          new LinearLayout.LayoutParams(
                                  0,
                                  LinearLayout.LayoutParams.WRAP_CONTENT,
                                  1
                          )
                  );

                  buttons.addView(
                          stopButton,
                          new LinearLayout.LayoutParams(
                                  0,
                                  LinearLayout.LayoutParams.WRAP_CONTENT,
                                  1
                          )
                  );

                  root.addView(buttons);

                  progressBar = new ProgressBar(this);
                  progressBar.setVisibility(ProgressBar.GONE);

                  root.addView(
                          progressBar,
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.WRAP_CONTENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                  );

                  resultText = new TextView(this);
                  resultText.setTextSize(17);
                  resultText.setPadding(8, 24, 8, 8);

                  root.addView(
                          resultText,
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                  );

                  setContentView(root);

                  searchButton.setOnClickListener(
                          view -> checkWallet()
                  );

                  stopButton.setOnClickListener(
                          view -> stopChecking()
                  );
              }

              private void stopChecking() {

                  running = false;

                  progressBar.setVisibility(
                          ProgressBar.GONE
                  );

                  searchButton.setEnabled(true);

                  resultText.setText(
                          "⏹ بررسی متوقف شد."
                  );
              }

              private void checkWallet() {

                  final String address =
                          addressInput.getText()
                                  .toString()
                                  .trim();

                  if (address.isEmpty()) {
                      resultText.setText(
                              "⚠️ ابتدا آدرس عمومی Bitcoin را وارد کنید."
                      );
                      return;
                  }

                  running = true;

                  searchButton.setEnabled(false);

                  progressBar.setVisibility(
                          ProgressBar.VISIBLE
                  );

                  resultText.setText(
                          "⏳ در حال دریافت اطلاعات عمومی بلاکچین..."
                  );

                  new Thread(() -> {

                      try {

                          String apiUrl =
                                  "https://blockstream.info/api/address/"
                                          + address;

                          JSONObject data =
                                  getJson(apiUrl);

                          JSONObject stats =
                                  data.optJSONObject("chain_stats");

                          if (stats == null) {
                              throw new Exception(
                                      "Invalid response"
                              );
                          }

                          long received =
                                  stats.optLong(
                                          "funded_txo_sum",
                                          0
                                  );

                          long spent =
                                  stats.optLong(
                                          "spent_txo_sum",
                                          0
                                  );

                          long balance =
                                  received - spent;

                          int transactions =
                                  stats.optInt(
                                          "tx_count",
                                          0
                                  );

                          double btc =
                                  balance / 100000000.0;

                          final String output;

                          if (balance > 0) {

                              output =
                                      "📍 آدرس\n\n"
                                      + address
                                      + "\n\n"
                                      + "💰 موجودی\n"
                                      + String.format(
                                              Locale.US,
                                              "%.8f BTC",
                                              btc
                                      )
                                      + "\n\n"
                                      + "📊 تراکنش‌ها\n"
                                      + transactions
                                      + "\n\n"
                                      + "✅ دارای موجودی";

                          } else {

                              output =
                                      "📍 آدرس\n\n"
                                      + address
                                      + "\n\n"
                                      + "💰 موجودی\n"
                                      + "0.00000000 BTC"
                                      + "\n\n"
                                      + "📊 تراکنش‌ها\n"
                                      + transactions
                                      + "\n\n"
                                      + "⚪ موجودی صفر";
                          }

                          handler.post(() -> {

                              progressBar.setVisibility(
                                      ProgressBar.GONE
                              );

                              searchButton.setEnabled(true);

                              if (running) {
                                  resultText.setText(output);
                              }
                          });

                      } catch (Exception error) {

                          handler.post(() -> {

                              progressBar.setVisibility(
                                      ProgressBar.GONE
                              );

                              searchButton.setEnabled(true);

                              resultText.setText(
                                      "❌ خطا در دریافت اطلاعات.\n\n"
                                      + "آدرس را بررسی کنید و دوباره تلاش کنید."
                              );
                          });
                      }

                  }).start();
              }

              private JSONObject getJson(String address)
                      throws Exception {

                  HttpURLConnection connection = null;
                  BufferedReader reader = null;

                  try {

                      URL url = new URL(address);

                      connection =
                              (HttpURLConnection)
                                      url.openConnection();

                      connection.setRequestMethod("GET");
                      connection.setConnectTimeout(15000);
                      connection.setReadTimeout(15000);
                      connection.setUseCaches(false);

                      connection.setRequestProperty(
                              "User-Agent",
                              "WalletScanner/2.0"
                      );

                      int responseCode =
                              connection.getResponseCode();

                      InputStream stream;

                      if (responseCode >= 200
                              && responseCode < 300) {

                          stream =
                                  connection.getInputStream();

                      } else {

                          stream =
                                  connection.getErrorStream();

                          if (stream == null) {
                              throw new Exception(
                                      "HTTP " + responseCode
                              );
                          }
                      }

                      reader =
                              new BufferedReader(
                                      new InputStreamReader(
                                              stream,
                                              "UTF-8"
                                      )
                              );

                      StringBuilder response =
                              new StringBuilder();

                      String line;

                      while ((line = reader.readLine()) != null) {
                          response.append(line);
                      }

                      if (responseCode < 200
                              || responseCode >= 300) {

                          throw new Exception(
                                  "HTTP " + responseCode
                          );
                      }

                      return new JSONObject(
                              response.toString()
                      );

                  } finally {

                      if (reader != null) {
                          try {
                              reader.close();
                          } catch (Exception ignored) {
                          }
                      }

                      if (connection != null) {
                          connection.disconnect();
                      }
                  }
              }
          }
          EOF

          cd WalletScanner
          gradle wrapper --gradle-version 8.9

      - name: Build APK
        working-directory: WalletScanner
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp WalletScanner/app/build/outputs/apk/debug/app-debug.apk \
             WalletScanner-FREE-2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WalletScanner-FREE-2.0
          path: WalletScanner-FREE-2.0.apk
