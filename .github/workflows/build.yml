name: Wallet Scanner FREE 2.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create project
        shell: bash
        run: |

          mkdir -p WalletScanner/app/src/main/java/com/walletscanner
          mkdir -p WalletScanner/app/src/main/res/values
          mkdir -p WalletScanner/app/src/main/res/drawable

          cat > WalletScanner/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WalletScanner"
          include(":app")
          EOF

          cat > WalletScanner/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > WalletScanner/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > WalletScanner/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.walletscanner'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.walletscanner'
                  minSdk 23
                  targetSdk 35
                  versionCode 20
                  versionName '2.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > WalletScanner/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#0088CC</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>

              </style>

          </resources>
          EOF

          cat > WalletScanner/app/src/main/res/drawable/app_icon.xml <<'EOF'
          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#071D2B"
                  android:pathData="M0,0 L108,0 L108,108 L0,108 Z"/>

              <path
                  android:fillColor="#00CFFF"
                  android:pathData="M54,10 L62,43 L77,49 L62,55 L54,98 L46,55 L31,49 L46,43 Z"/>

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,22 L58,44 L68,49 L58,52 L54,84 L50,52 L40,49 L50,44 Z"/>

          </vector>
          EOF

          cat > WalletScanner/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Wallet Scanner"
                  android:icon="@drawable/app_icon"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN"/>

                          <category
                              android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > WalletScanner/app/src/main/java/com/walletscanner/MainActivity.java <<'EOF'
          package com.walletscanner;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.widget.*;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Locale;

          public class MainActivity extends Activity {

              EditText address;
              TextView result;
              ProgressBar progress;
              Button search;

              Handler handler =
                      new Handler(Looper.getMainLooper());

              volatile boolean running = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setPadding(
                          25,35,25,25);

                  TextView title =
                          new TextView(this);

                  title.setText(
                          "🔎 Wallet Scanner");

                  title.setTextSize(28);

                  title.setGravity(
                          Gravity.CENTER);

                  root.addView(title);

                  TextView version =
                          new TextView(this);

                  version.setText(
                          "FREE 2.0");

                  version.setGravity(
                          Gravity.CENTER);

                  version.setTextSize(16);

                  root.addView(version);

                  address =
                          new EditText(this);

                  address.setHint(
                          "آدرس عمومی Bitcoin");

                  address.setSingleLine(true);

                  root.addView(address);

                  LinearLayout buttons =
                          new LinearLayout(this);

                  search =
                          new Button(this);

                  search.setText(
                          "🔍 بررسی");

                  Button stop =
                          new Button(this);

                  stop.setText(
                          "⏹ توقف");

                  buttons.addView(
                          search,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1));

                  buttons.addView(
                          stop,
                          new LinearLayout.LayoutParams(
                                  0,
                                  -2,
                                  1));

                  root.addView(buttons);

                  progress =
                          new ProgressBar(this);

                  progress.setVisibility(
                          ProgressBar.GONE);

                  root.addView(progress);

                  result =
                          new TextView(this);

                  result.setTextSize(17);

                  result.setPadding(
                          10,25,10,10);

                  root.addView(result);

                  setContentView(root);

                  search.setOnClickListener(
                          v -> checkWallet());

                  stop.setOnClickListener(
                          v -> {

                              running = false;

                              progress.setVisibility(
                                      ProgressBar.GONE);

                              result.setText(
                                      "⏹ بررسی متوقف شد.");

                              search.setEnabled(true);
                          });
              }

              void checkWallet() {

                  String a =
                          address.getText()
                          .toString()
                          .trim();

                  if(a.isEmpty()) {

                      result.setText(
                              "ابتدا آدرس را وارد کنید.");

                      return;
                  }

                  running = true;

                  search.setEnabled(false);

                  progress.setVisibility(
                          ProgressBar.VISIBLE);

                  result.setText(
                          "در حال دریافت اطلاعات عمومی بلاکچین...");

                  new Thread(() -> {

                      try {

                          String url =
                                  "https://blockstream.info/api/address/"
                                  + a;

                          JSONObject data =
                                  request(url);

                          JSONObject stats =
                                  data.getJSONObject(
                                          "chain_stats");

                          long received =
                                  stats.optLong(
                                          "funded_txo_sum",
                                          0);

                          long spent =
                                  stats.optLong(
                                          "spent_txo_sum",
                                          0);

                          long balance =
                                  received - spent;

                          int tx =
                                  stats.optInt(
                                          "tx_count",
                                          0);

                          double btc =
                                  balance / 100000000.0;

                          String text =
                                  "📍 آدرس\n\n"
                                  + a
                                  + "\n\n"
                                  + "💰 موجودی\n"
                                  + String.format(
                                      Locale.US,
                                      "%.8f BTC",
                                      btc)
                                  + "\n\n"
                                  + "📊 تعداد تراکنش‌ها\n"
                                  + tx;

                          if(balance > 0) {

                              text +=
                                  "\n\n✅ دارای موجودی";
                          } else {

                              text +=
                                  "\n\n⚪ موجودی صفر";
                          }

                          handler.post(() -> {

                              progress.setVisibility(
                                      ProgressBar.GONE);

                              search.setEnabled(true);

                              if(running)
                                  result.setText(text);
                          });

                      } catch(Exception e) {

                          handler.post(() -> {

                              progress.setVisibility(
                                      ProgressBar.GONE);

                              search.setEnabled(true);

                              result.setText(
                                  "❌ آدرس معتبر نیست یا "
                                  + "اتصال به شبکه برقرار نشد.");
                          });
                      }

                  }).start();
              }

              JSONObject request(String url)
                      throws Exception {

                  HttpURLConnection connection =
                          (HttpURLConnection)
                                  new URL(url)
                                  .openConnection();

                  connection.setRequestMethod("GET");

                  connection.setConnectTimeout(
                          15000);

                  connection.setReadTimeout(
                          15000);

                  connection.setRequestProperty(
                          "User-Agent",
                          "WalletScanner/2.0");

                  BufferedReader reader =
                          new BufferedReader(
                              new InputStreamReader(
                                  connection
                                  .getInputStream()));

                  StringBuilder response =
                          new StringBuilder();

                  String line;

                  while((line =
                          reader.readLine()) != null) {

                      response.append(line);
                  }

                  reader.close();

                  connection.disconnect();

                  return new JSONObject(
                          response.toString());
              }
          }
          EOF

          cd WalletScanner

          gradle wrapper --gradle-version 8.9

      - name: Build APK
        working-directory: WalletScanner
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp WalletScanner/app/build/outputs/apk/debug/app-debug.apk \
             WalletScanner-FREE-2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WalletScanner-FREE-2.0
          path: WalletScanner-FREE-2.0.apk
