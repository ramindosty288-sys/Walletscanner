package com.example.walletscanner

import android.os.Bundle
import android.view.Gravity
import android.widget.*
import androidx.appcompat.app.AppCompatActivity
import java.util.Locale

class MainActivity : AppCompatActivity() {

    private lateinit var addressInput: EditText
    private lateinit var networkSpinner: Spinner
    private lateinit var resultText: TextView
    private lateinit var searchButton: Button
    private lateinit var autoButton: Button

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        buildInterface()
    }

    private fun buildInterface() {

        val root = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            gravity = Gravity.CENTER_HORIZONTAL
            setPadding(32, 50, 32, 32)
        }

        val title = TextView(this).apply {
            text = "🌐 Wallet Scanner FREE 2.0"
            textSize = 25f
            gravity = Gravity.CENTER
            setPadding(0, 0, 0, 20)
        }

        val subtitle = TextView(this).apply {
            text = "بررسی کیف پول‌های عمومی"
            textSize = 16f
            gravity = Gravity.CENTER
            setPadding(0, 0, 0, 25)
        }

        addressInput = EditText(this).apply {
            hint = "آدرس عمومی کیف پول را وارد کنید"
            textSize = 16f
            singleLine = true
            setPadding(25, 20, 25, 20)
        }

        val addressParams = LinearLayout.LayoutParams(
            LinearLayout.LayoutParams.MATCH_PARENT,
            LinearLayout.LayoutParams.WRAP_CONTENT
        )

        root.addView(title)
        root.addView(subtitle)
        root.addView(addressInput, addressParams)

        networkSpinner = Spinner(this)

        val networks = arrayOf(
            "🌐 همه شبکه‌ها",
            "₿ Bitcoin",
            "♦ Ethereum",
            "🟡 BNB Chain",
            "🟣 Polygon",
            "🔴 Tron",
            "🟢 Solana",
            "🐕 Dogecoin",
            "Ł Litecoin"
        )

        val adapter = ArrayAdapter(
            this,
            android.R.layout.simple_spinner_dropdown_item,
            networks
        )

        networkSpinner.adapter = adapter

        root.addView(networkSpinner, addressParams)

        searchButton = Button(this).apply {
            text = "🔍 جستجوی آدرس"
            textSize = 16f
        }

        root.addView(searchButton, addressParams)

        autoButton = Button(this).apply {
            text = "🤖 جستجوی خودکار"
            textSize = 16f
        }

        root.addView(autoButton, addressParams)

        resultText = TextView(this).apply {
            text = """
                نتیجه جستجو اینجا نمایش داده می‌شود.

                می‌توانید:
                • یک آدرس عمومی وارد کنید
                • شبکه را انتخاب کنید
                • یا جستجوی خودکار را اجرا کنید
            """.trimIndent()

            textSize = 16f
            setPadding(20, 30, 20, 20)
        }

        root.addView(resultText, addressParams)

        setContentView(root)

        searchButton.setOnClickListener {
            searchWallet()
        }

        autoButton.setOnClickListener {
            automaticSearch()
        }
    }

    private fun searchWallet() {

        val address = addressInput.text.toString().trim()

        if (address.isEmpty()) {
            Toast.makeText(
                this,
                "لطفاً یک آدرس عمومی وارد کنید",
                Toast.LENGTH_SHORT
            ).show()
            return
        }

        val selectedNetwork =
            networkSpinner.selectedItem.toString()

        resultText.text = """
            🔎 در حال بررسی...

            آدرس:
            $address

            شبکه:
            $selectedNetwork

            لطفاً صبر کنید...
        """.trimIndent()

        /*
         * مرحله بعد:
         * اتصال این قسمت به API بلاکچین
         */
    }

    private fun automaticSearch() {

        resultText.text = """
            🤖 جستجوی خودکار

            در حال آماده‌سازی جستجوی آدرس‌های
            عمومیِ قابل‌بررسی...

            شبکه:
            ${networkSpinner.selectedItem}

            این بخش باید به API عمومی
            بلاکچین متصل شود.
        """.trimIndent()
    }
}
